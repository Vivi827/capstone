name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ruff

      - name: Lint (breakage only — syntax + undefined names, no style)
        run: ruff check --select E9,F63,F7,F82 backend ai

      - name: Byte-compile (syntax check)
        run: python -m compileall -q backend ai

      - name: Backend smoke and speech regression tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/test_smoke.py backend/test_tts.py tests/test_generate_feedback.py tests/test_ai_reply_shaping.py
